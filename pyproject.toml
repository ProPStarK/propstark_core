[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "propstark-core"
version = "0.1.0"
description = "Analysis and display helpers for the ProPStarK EVLA Large program"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "astropy>=5.0",
    "matplotlib>=3.4",
    "mosaic_proposal_helper>=0.5",
    "numpy>=1.21",
    "pandas",
    "pyvo",
    "python-dotenv",
    "PyYAML",
    "radio-beam>=0.3",
    "scikit-image>=0.9",
    "scipy>=1.7",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
propstark_core = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
